name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  # main: at most one running + one pending (never cancel a main run); branches: cancel superseded runs
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Keep Cargo artifacts outside the checkout
        run: printf 'CARGO_TARGET_DIR=%s/tessera-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: fixtures/raw
          key: raw-fixtures-${{ hashFiles('fixtures/fetch.sh') }}
      - run: bash fixtures/fetch.sh
      - run: cargo install cargo-deny --locked
      - run: bash ci.sh
      - name: Build release FFI and test Swift
        run: ./build-ffi.sh && swift build -c release && swift test -c release
        working-directory: apps/mac
      - run: bash Support/release/test-release.sh
        working-directory: apps/mac
