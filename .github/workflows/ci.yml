name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Keep Cargo artifacts outside the checkout
        run: printf 'CARGO_TARGET_DIR=%s/tessera-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: fixtures/raw
          key: raw-fixtures-${{ hashFiles('fixtures/fetch.sh') }}
      - run: bash fixtures/fetch.sh
      - run: cargo install cargo-deny --locked
      - run: bash ci.sh
      - run: ./build-ffi.sh && swift build && swift test
        working-directory: apps/mac
      - run: bash Support/release/test-release.sh
        working-directory: apps/mac
