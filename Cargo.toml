[workspace]
resolver = "2"
members = [
    "crates/tether",
    "crates/agent",
    "crates/tessera-mcp",
    "crates/merge",
    "crates/color-mgmt",
    "crates/lens",
    "crates/export",
    "crates/image-core",
    "crates/raw-decode",
    "crates/pipeline-cpu",
    "crates/pipeline-adobe",
    "crates/gpu-core",
    "crates/pipeline-gpu",
    "crates/recipe",
    "crates/sidecar",
    "crates/index",
    "crates/library",
    "crates/previews",
    "crates/import-lrcat",
    "crates/cull",
    "crates/style-profile",
    "crates/ml-runtime",
    "crates/ml-embed",
    "crates/ml-caption",
    "crates/ml-enhance",
    "crates/ml-faces",
    "crates/ml-quality",
    "crates/ml-segment",
    "crates/mask-ai",
    "crates/ml-depth",
    "crates/jobs",
    "crates/engine-api",
    "crates/tessera-ffi",
    "crates/libraw-ffi",
    "crates/compositor",
    "crates/filters",
    "crates/psd",
    "crates/brush",
    "crates/selection",
    "crates/vector",
    "crates/typography",
    "apps/tessera-cli",
]

[workspace.dependencies]
wgpu = "30"
rusqlite = { version = "0.40", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
zune-jpeg = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jxl-oxide = "0.12"
# Bundle LittleCMS into the Rust static archive consumed by the Swift app/tests.
lcms2 = { version = "6", features = ["static"] }
ort = "=2.0.0-rc.13"
uniffi = "0.32"
walkdir = "2"
kamadak-exif = "0.6"
blake3 = "1"
tempfile = "3"
png = "=0.17.16"

# Exercise bundled SQLite at production speed in debug benchmark tests.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
