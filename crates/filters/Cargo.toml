[package]
name = "filters"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Non-destructive raster filters and direct image adjustments"

[features]
default = []
camera-raw-filter = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
compositor = { path = "../compositor" }
engine-api = { path = "../engine-api" }
pipeline-cpu = { path = "../pipeline-cpu" }
wgpu.workspace = true
bytemuck.workspace = true
pollster = "0.4"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
