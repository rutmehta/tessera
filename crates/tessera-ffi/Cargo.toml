[package]
license = "Apache-2.0"
name = "tessera-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
jobs = { path = "../jobs" }
engine-api = { path = "../engine-api" }
index = { path = "../index" }
sidecar = { path = "../sidecar" }
previews = { path = "../previews" }
raw-decode = { path = "../raw-decode" }
cull = { path = "../cull" }
library = { path = "../library" }
import-lrcat = { path = "../import-lrcat" }
color-mgmt = { path = "../color-mgmt" }
image-core = { path = "../image-core" }
pipeline-cpu = { path = "../pipeline-cpu" }
pipeline-gpu = { path = "../pipeline-gpu" }
ml-runtime = { path = "../ml-runtime" }
ml-segment = { path = "../ml-segment" }
anyhow.workspace = true
blake3.workspace = true
uniffi = { workspace = true, features = ["cli"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
image.workspace = true
kamadak-exif.workspace = true

[dev-dependencies]
import-lrcat = { path = "../import-lrcat", features = ["fixture"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
