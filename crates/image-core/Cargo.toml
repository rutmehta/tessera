[package]
name = "image-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
ml-denoise = ["dep:ml-enhance", "dep:ml-runtime"]

[dependencies]
ml-enhance = { path = "../ml-enhance", optional = true }
ml-runtime = { path = "../ml-runtime", optional = true }
engine-api = { path = "../engine-api" }
pipeline-cpu = { path = "../pipeline-cpu" }
pipeline-adobe = { path = "../pipeline-adobe" }
raw-decode = { path = "../raw-decode" }
half = { workspace = true }

[dev-dependencies]
jobs = { path = "../jobs" }
