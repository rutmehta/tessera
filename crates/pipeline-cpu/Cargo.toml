[package]
name = "pipeline-cpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
engine-api = { path = "../engine-api" }
color-mgmt = { path = "../color-mgmt" }
raw-decode = { path = "../raw-decode" }
lens = { path = "../lens" }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
half = { workspace = true }
blake3 = { workspace = true }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
png = { workspace = true }
