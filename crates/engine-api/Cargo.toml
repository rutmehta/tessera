[package]
name = "engine-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Shared contracts (tiles, colour, recipes, jobs, stages, tool API, errors) for the photo engine"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = "1"
half = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
