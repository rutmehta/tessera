[package]
name = "pipeline-gpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
jobs = { path = "../jobs" }
wgpu.workspace = true
bytemuck.workspace = true
pollster = "0.4"
engine-api = { path = "../engine-api" }
gpu-core = { path = "../gpu-core" }
image-core = { path = "../image-core" }
color-mgmt = { path = "../color-mgmt" }
pipeline-cpu = { path = "../pipeline-cpu" }
raw-decode = { path = "../raw-decode" }

[dev-dependencies]
ml-enhance = { path = "../ml-enhance" }
ml-runtime = { path = "../ml-runtime" }
lens = { path = "../lens" }
log = "0.4"
lcms2.workspace = true
naga = { version = "30", features = ["wgsl-in"] }
half.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
