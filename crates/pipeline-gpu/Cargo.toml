[package]
name = "pipeline-gpu"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
pollster = "0.4"
engine-api = { path = "../engine-api" }
image-core = { path = "../image-core" }
pipeline-cpu = { path = "../pipeline-cpu" }
raw-decode = { path = "../raw-decode" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"

[dev-dependencies]
log = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
