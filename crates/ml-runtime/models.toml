# DRUNet color: MIT export and upstream cszn/KAIR MIT weights.
# https://huggingface.co/synthscript/drunet-color-onnx
# https://github.com/cszn/KAIR/blob/master/LICENSE
# Actual downloaded bytes hashed locally; dynamic H/W must be divisible by 8.
[[models]]
id = "enhance/drunet-color"
version = "a2b9fccfa27b197f44a3876c567f5e48970c44a7"
task = "rgb-denoise"
dtype = "fp32"
sha256 = "2ae3ab5eb15daac2ee79be984d584b908ce7f0f60b27be87d005f728c2aa0087"
download_url = "https://huggingface.co/synthscript/drunet-color-onnx/resolve/a2b9fccfa27b197f44a3876c567f5e48970c44a7/drunet_color.onnx"
inputs = [{ name = "input", shape = [1, 4, 32, 32], dtype = "fp32" }]
outputs = [{ name = "output", shape = [1, 3, 32, 32], dtype = "fp32" }]

# Segmentation artifacts: independently downloaded and SHA-256 checked.
[[models]]
id = "depth/anything-v2-small"
version = "4472b7362082ad9968fee890ca0f1e5aca36b93d"
task = "relative-inverse-depth"
dtype = "fp32"
# Apache-2.0 SMALL only; opset 14; 99060839 bytes. See tools/orchestrate/wp/M3-06/DEPTH.md.
sha256 = "afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c"
download_url = "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model.onnx"
# Dynamic H/W multiples of 14; representative square shape below.
inputs = [{ name = "pixel_values", shape = [1, 3, 518, 518], dtype = "fp32" }]
outputs = [{ name = "predicted_depth", shape = [1, 518, 518], dtype = "fp32" }]

