[[models]]
id = "segment/sam-encoder"
version = "5050a79cd4b912dd745fff83047c4ef6fbd97be5"
task = "prompt-segmentation-encoder"
dtype = "fp32"
# size_bytes = 28157853; Apache-2.0; opset 18
sha256 = "8c1494f7dc70b61b15bc7ab8e4291804d47294d881da137b099b04c1776535dd"
download_url = "https://huggingface.co/nrl-ai/samexporter-onnx-models/resolve/5050a79cd4b912dd745fff83047c4ef6fbd97be5/mobile_sam/mobile_sam.encoder.onnx"
# H/W dynamic: representative square only. RGB HWC 0..255, NOT NCHW.
inputs = [{ name = "input_image", shape = [1024, 1024, 3], dtype = "fp32" }]
outputs = [{ name = "image_embeddings", shape = [1, 256, 64, 64], dtype = "fp32" }]

[[models]]
id = "segment/sam-decoder"
version = "5050a79cd4b912dd745fff83047c4ef6fbd97be5"
task = "prompt-segmentation-decoder"
dtype = "fp32"
# size_bytes = 16502895; Apache-2.0; opset 18
sha256 = "23c11087a0c1930d863ba37fdf0f2b0080f5a94269191f679ffd16b8415f0a38"
download_url = "https://huggingface.co/nrl-ai/samexporter-onnx-models/resolve/5050a79cd4b912dd745fff83047c4ef6fbd97be5/mobile_sam/mobile_sam.decoder.onnx"
# N dynamic; shown N=2 (one click + dummy). masks H/W = orig_im_size.
inputs = [
  { name = "image_embeddings", shape = [1, 256, 64, 64], dtype = "fp32" },
  { name = "point_coords", shape = [1, 2, 2], dtype = "fp32" },
  { name = "point_labels", shape = [1, 2], dtype = "fp32" },
  { name = "mask_input", shape = [1, 1, 256, 256], dtype = "fp32" },
  { name = "has_mask_input", shape = [1], dtype = "fp32" },
  { name = "orig_im_size", shape = [2], dtype = "fp32" },
]
outputs = [
  { name = "masks", shape = [1, 1, 1024, 1024], dtype = "fp32" },
  { name = "iou_predictions", shape = [1, 1], dtype = "fp32" },
  { name = "low_res_masks", shape = [1, 1, 256, 256], dtype = "fp32" },
]

