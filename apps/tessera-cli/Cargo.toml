[package]
name = "tessera-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
agent = { path = "../../crates/agent" }
style-profile = { path = "../../crates/style-profile" }
image-core = { path = "../../crates/image-core" }
engine-api = { path = "../../crates/engine-api" }
index = { path = "../../crates/index" }
cull = { path = "../../crates/cull" }
sidecar = { path = "../../crates/sidecar" }
raw-decode = { path = "../../crates/raw-decode" }
previews = { path = "../../crates/previews" }
import-lrcat = { path = "../../crates/import-lrcat", features = ["fixture"] }
ml-runtime = { path = "../../crates/ml-runtime" }
ml-enhance = { path = "../../crates/ml-enhance" }
export = { path = "../../crates/export" }
pipeline-cpu = { path = "../../crates/pipeline-cpu" }
pipeline-adobe = { path = "../../crates/pipeline-adobe" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
anyhow.workspace = true
serde_json.workspace = true
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
rusqlite.workspace = true
