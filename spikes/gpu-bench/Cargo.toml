[package]
name = "gpu-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "M0-07 spike: wgpu 30 compute vs native Metal (MSL) for demosaic, guided filter and Oklab 3D LUT"

# Standalone: not part of the root workspace.
[workspace]

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[profile.release]
opt-level = 3
debug = false
